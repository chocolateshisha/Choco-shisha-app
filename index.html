<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Choco Shisha" />
  <meta name="description" content="Chocolate Shisha Store NG - Premium Shisha, Vapes, Snacks & More" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Chocolate Shisha Store NG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d0d0d;
    }
    /* Loading state */
    #loader {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    #loader img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    #loader p {
      color: #aaa;
      font-size: 14px;
    }
    /* Safe area for notched phones */
    @supports (padding: env(safe-area-inset-top)) {
      #app {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="icon-192.png" alt="Chocolate Shisha Store NG" />
    <p>Loading menu…</p>
  </div>
  <div id="app">
    <iframe
      id="menu-frame"
      src="https://www.menurite.app/premiumshisha"
      title="Chocolate Shisha Store NG Menu"
      loading="eager"
      allow="geolocation; payment"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <script>
    // Hide loader when iframe loads
    const frame = document.getElementById('menu-frame');
    const loader = document.getElementById('loader');
    frame.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('hide'), 300);
    });
    // Fallback hide after 4s
    setTimeout(() => loader.classList.add('hide'), 4000);

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
