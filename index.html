<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Choco Shisha" />
  <meta name="description" content="Chocolate Shisha Store NG - Premium Shisha, Vapes, Snacks & More" />
  
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <link rel="manifest" href="manifest.json" />
  
  <title>Chocolate Shisha Store NG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0f0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #1a0f0a;
    }

    /* ===== Beautiful Splash / Loading Screen ===== */
    #loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #1a0f0a 0%, #2c1810 50%, #1a0f0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #loader .logo-box {
      width: 180px;
      height: 180px;
      background: #fff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      margin-bottom: 28px;
      overflow: hidden;
    }
    #loader .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    #loader .store-name {
      color: #f5e6d3;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
    }
    #loader .tagline {
      color: #c4a484;
      font-size: 13px;
      margin-bottom: 32px;
      text-align: center;
    }
    #loader .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(196, 164, 132, 0.25);
      border-top-color: #c4a484;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Safe area for notched phones */
    @supports (padding: env(safe-area-inset-top)) {
      #app {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>
  <!-- Splash Screen with your logo -->
  <div id="loader">
    <div class="logo-box">
      <img src="icon-512.png" alt="Chocolate Shisha Store NG" />
    </div>
    <div class="store-name">Chocolate Shisha Store NG</div>
    <div class="tagline">The home of all goods</div>
    <div class="spinner"></div>
  </div>

  <div id="app">
    <iframe
      id="menu-frame"
      src="https://www.menurite.app/premiumshisha"
      title="Chocolate Shisha Store NG Menu"
      loading="eager"
      allow="geolocation; payment"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById('menu-frame');
    const loader = document.getElementById('loader');

    // Hide splash when menu is ready
    frame.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('hide'), 400);
    });

    // Safety fallback
    setTimeout(() => loader.classList.add('hide'), 5000);

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
